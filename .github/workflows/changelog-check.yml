name: Changelog check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require docs/CHANGELOG.md when apps or packages change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD)
          if echo "$changed" | grep -qE '^(apps|packages)/'; then
            if ! echo "$changed" | grep -qx 'docs/CHANGELOG.md'; then
              echo "::error::This PR changes apps/ or packages/ but not docs/CHANGELOG.md. Add an entry (format at the top of the file) or add the 'skip-changelog' label for trivial changes."
              exit 1
            fi
          fi
          echo "Changelog OK"
