# Production API on the VPS. Postgres is external (Supabase) — see docs/architecture/deployment.md.
services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    restart: unless-stopped
    expose: ['8787']
    deploy:
      resources:
        limits:
          memory: 512m
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
volumes:
  caddy_data:
